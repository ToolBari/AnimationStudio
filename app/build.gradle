// ============================================================
// app/build.gradle  (module level)
// Groovy DSL — kept AndroidIDE-compatible on purpose.
// ============================================================
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.din.htmltomp4'
    compileSdk 34

    defaultConfig {
        applicationId "com.din.htmltomp4"
        minSdk 26          // PixelCopy for Views requires API 26+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // ---- Core / Compose ----
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "androidx.activity:activity-compose:1.9.1"
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4"

    // ---- Material Components (XML theme styles) ----
    // Required even in a Compose-only app: androidx.media3:media3-ui's
    // internal manifest references Theme.Material3.DayNight.NoActionBar,
    // which is only defined here — omitting this causes an AAPT link
    // failure ("resource style/Theme.Material3.DayNight.NoActionBar not
    // found") even though we never reference this style ourselves.
    implementation "com.google.android.material:material:1.12.0"

    // ---- WebView / Media3 video preview player ----
    implementation "androidx.media3:media3-exoplayer:1.4.0"
    implementation "androidx.media3:media3-ui:1.4.0"

    // ---- Coroutines ----
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // ---- FFmpeg ----
    // NOTE: com.arthenica:ffmpeg-kit-full-gpl is RETIRED (binaries removed
    // from Maven Central, April 2025). Do not use it — the build will fail
    // with "Could not resolve" errors. Using an actively-hosted community
    // fork with the same API surface instead:
    implementation "com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1"
    // If you'd rather pin the last-known-good original artifact from a
    // mirror/local .aar, drop the file in app/libs/ and use:
    // implementation files('libs/ffmpeg-kit-full-gpl-6.0.aar')

    // ---- Coil (for recent-conversion thumbnails) ----
    implementation "io.coil-kt:coil-compose:2.6.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
}